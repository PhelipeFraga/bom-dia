<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bom dia</title>

<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0b0d12;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--txt:#f2f4f8;--dim:rgba(242,244,248,.55);--acc:#8ab4ff;--rain:#6fd0ff;--warm:#ffc27a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding-bottom:40px}
.sky{position:relative;height:460px;overflow:hidden;border-radius:0 0 32px 32px;transition:background 1s}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);filter:blur(28px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-60%)}to{transform:translateX(160%)}}
.hero{position:absolute;inset:0;padding:28px 24px;display:flex;flex-direction:column}
.date{font-size:14px;color:rgba(255,255,255,.75);font-weight:500}
.hi{font-size:22px;font-weight:500;margin-top:2px}
.t{font-size:112px;font-weight:200;line-height:1;margin-top:28px;letter-spacing:-4px}
.t sup{font-size:48px;vertical-align:top;margin-left:2px}
.cond{font-size:18px;font-weight:500;margin-top:4px}
.mm{font-size:14px;color:rgba(255,255,255,.75);margin-top:2px}
.sunw{position:absolute;left:24px;right:24px;bottom:14px}
.sunw svg{width:100%;height:auto;display:block;max-height:78px}
.sunl{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.8);margin-top:2px}
#smid{font-weight:600;color:#fff}
.pill{display:inline-block;margin-top:12px;font-size:13px;font-weight:500;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);width:fit-content}
.sec{margin:16px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;overflow:hidden}
.h{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.h b{font-weight:500;letter-spacing:0;text-transform:none;color:var(--dim)}
.hrs{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hrs::-webkit-scrollbar{display:none}
.hr{flex:none;width:58px;padding:12px 0;border-radius:18px;text-align:center;scroll-snap-align:start}
.hr.now{background:rgba(255,255,255,.1)}
.hr .l{font-size:12px;color:var(--dim);font-weight:500}.hr.now .l{color:var(--txt)}
.hr svg{width:30px;height:30px;margin:8px auto 6px;display:block}
.hr .v{font-size:17px;font-weight:500}
.hr .p{font-size:11px;color:var(--rain);font-weight:600;height:14px;margin-top:2px}
.hr.sunx .v{font-size:12px;color:var(--warm)}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:99px;padding:3px;letter-spacing:0;text-transform:none}
.sg{font-size:13px;font-weight:500;padding:5px 14px;border-radius:99px;color:var(--dim);cursor:pointer}
.sg.on{background:var(--txt);color:var(--bg)}
.chip{font-size:12px;font-weight:500;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--dim)}
.chip b{color:var(--txt);font-weight:600}
.dy{display:grid;grid-template-columns:44px 28px 34px 30px 1fr 30px;align-items:center;gap:6px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.dy .n{font-weight:500}.dy svg{width:26px;height:26px}
.dy .rp{font-size:12px;color:var(--rain);font-weight:600}
.dy .mn{color:var(--dim);text-align:right}.dy .mx{text-align:right;font-weight:500}
.rg{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.08)}
.rg i{position:absolute;top:0;bottom:0;border-radius:6px}
.rg em{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2px solid var(--bg)}
#map{height:300px;border-radius:16px;margin:0 -4px;background:#111}
.leaflet-container{background:#111;font-family:inherit}
.mapbar{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--dim)}
.prog{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--rain);width:0;transition:width .4s}
.lg{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--dim);margin-top:8px}
.lg i{width:28px;height:6px;border-radius:3px}
.rem{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:15px}
.rem .d{min-width:44px;text-align:center;font-size:12px;color:var(--dim);line-height:1.1}.rem .d b{display:block;font-size:20px;font-weight:500;color:var(--txt)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:6px;scrollbar-width:none}
.tab{font-size:13px;font-weight:500;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--dim);white-space:nowrap;cursor:pointer}
.tab.on{background:var(--txt);color:var(--bg)}
a.nw,a.card-link{display:block;color:inherit;text-decoration:none}
.nw{padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.nw small{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.nasa{height:190px;margin:-18px -18px 14px;background:radial-gradient(ellipse at 62% 38%,rgba(255,150,90,.35),transparent 45%),radial-gradient(ellipse at 38% 62%,rgba(90,140,255,.35),transparent 50%),#03040a;position:relative}
.nasa i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%}
.word{font-size:30px;font-weight:300}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 14px 0}.grid .sec{margin:0}
.big{font-size:34px;font-weight:300}
.foot{text-align:center;font-size:12px;color:var(--dim);margin-top:24px}
</style>
</head>

<div class="wrap">
  <div class="sky" id="sky">
    <div class="cloud" style="width:260px;height:90px;top:60px;animation-duration:70s"></div>

    <canvas id="rain"></canvas>
    <div class="hero">

      <div class="cond" id="cond">Carregando…</div>
      <div class="mm" id="mm"></div>
      <div class="pill" id="pill" style="display:none"></div>
      <div class="sunw" id="sunw" style="visibility:hidden">
        <svg viewBox="0 0 300 70">
          <line x1="6" y1="62" x2="294" y2="62" stroke="rgba(255,255,255,.3)"/>
          <path d="M20 62 Q150 -38 280 62" fill="none" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 5"/>
          <path id="sprog" fill="none" stroke="#ffd98a" stroke-width="2.5" stroke-linecap="round"/>
          <circle id="sunglow" r="13" fill="#ffd98a" opacity=".25"/>
          <circle id="sun" r="6.5" fill="#fff4d6"/>
        </svg>
        <div class="sunl"><span id="sr"></span><span id="smid"></span><span id="ss"></span></div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="h"><span class="seg"><span class="sg on" data-v="hrs">24 horas</span><span class="sg" data-v="days">7 dias</span></span><b id="rainmax"></b></div>
    <div class="hrs" id="hrs"></div>
    <div id="days" style="display:none"></div>
  </div>

  <div class="sec">
    <div class="h">Radar de chuva · ao vivo <b id="frametime"></b></div>
    <div id="map"></div>
    <div class="mapbar"><span id="pp" style="cursor:pointer">❚❚</span><div class="prog"><i id="prog"></i></div><span>últimas 2h</span></div>
    <div class="lg">fraca <i style="background:#88ddee"></i><i style="background:#0099cc"></i><i style="background:#ffaa00"></i><i style="background:#ff4400"></i> forte<span style="margin-left:auto">mapa: Esri · radar: RainViewer</span></div>
  </div>

  <div class="sec">
    <div class="h">Lembretes</div>
    <div class="rem"><div class="d"><b>+</b></div>Seus lembretes vão aparecer aqui (guardados só no seu celular)</div>
    
  </div>

  <div class="sec">
    <div class="h">Notícias <b id="newsat"></b></div>
    <div class="tabs" id="tabs"></div>
    <div id="news"><p class="nw" style="border:0;color:var(--dim)">Carregando…</p></div>
  </div>

  <a class="sec card-link" id="nasabox" target="_blank" rel="noopener" style="display:none">
    <div class="nasa" id="nasa"></div>
    <div class="h">Foto do dia · NASA</div>
    <p style="font-size:16px;font-weight:500" id="nasat"></p>
    <p style="font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5" id="nasad"></p>
  </a>

  <div class="sec" id="ndbox" style="display:none">
    <div class="h">Neste dia · <span id="ndday" style="letter-spacing:0;text-transform:none"></span></div>
    <div id="nd"></div>
  </div>

  <div class="sec" id="wbox" style="display:none">
    <div class="h">Palavra do dia</div>
    <div class="word" id="wen"></div>
    <p style="color:var(--dim);font-size:14px;margin-top:2px" id="wpt"></p>
    <p style="font-size:15px;margin-top:10px;font-style:italic" id="wex"></p>
  </div>

  <p class="foot" id="foot">Clima e radar ao vivo</p>
</div>

function skyFor(h){

let raining=false;

function sizeCv(){cv.width=cv.offsetWidth*devicePixelRatio;cv.height=cv.offsetHeight*devicePixelRatio}
sizeCv();addEventListener('resize',sizeCv);
for(let i=0;i<120;i++)drops.push({x:Math.random(),y:Math.random(),v:.006+Math.random()*.008,l:10+Math.random()*14});
(function loop(){cx.clearRect(0,0,cv.width,cv.height);if(raining){cx.strokeStyle="rgba(200,225,255,.45)";cx.lineWidth=1.2*devicePixelRatio;cx.beginPath();

requestAnimationFrame(loop)})();

function sun(w){
  const R=w.daily.sunrise.map(t=>new Date(t)),S=w.daily.sunset.map(t=>new Date(t)),agora=new Date();
  const f=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const dur=ms=>{const m=Math.round(ms/6e4);return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`};
  const P=c=>[(1-c)*(1-c)*20+2*(1-c)*c*150+c*c*280,(1-c)*(1-c)*62+2*(1-c)*c*(-38)+c*c*62];
  let i=R.findIndex((r,k)=>agora<S[k]);if(i<0)i=R.length-1;
  const rise=R[i],set=S[i],dia=agora>=rise&&agora<set,amanha=i>0;
  $('sr').textContent=`↑ ${f(rise)}`+(amanha?' amanhã':'');
  $('ss').textContent=`${f(set)} ↓`;
  const sunEl=$('sun'),glow=$('sunglow'),prog=$('sprog');
  if(dia){
    const c=(agora-rise)/(set-rise),[x,y]=P(c);
    let d='';for(let k=0;k<=40;k++){const[px,py]=P(c*k/40);d+=(k?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}
    prog.setAttribute('d',d);sunEl.setAttribute('cx',x);sunEl.setAttribute('cy',y);glow.setAttribute('cx',x);glow.setAttribute('cy',y);
    sunEl.style.display=glow.style.display='';
    $('smid').textContent=`pôr do sol em ${dur(set-agora)}`;
  }else{
    prog.setAttribute('d','');sunEl.style.display=glow.style.display='none';
    $('smid').textContent=`nasce em ${dur(rise-agora)}`;
  }
  $('sunw').style.visibility='visible';
}

const CL='<path d="M8 19h9.5a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 6.5 11a4 4 0 0 0 1.5 8z" fill="#e8edf5"/>';
const CLD='<path d="M8 19h9.5a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 6.5 11a4 4 0 0 0 1.5 8z" fill="#aab4c4"/>';
function ic(code,day){
  const sunG='<circle cx="12" cy="12" r="4.6" fill="#ffc94d"/>'+[0,45,90,135,180,225,270,315].map(a=>`<line x1="12" y1="3" x2="12" y2="5.2" stroke="#ffc94d" stroke-width="1.8" stroke-linecap="round" transform="rotate(${a} 12 12)"/>`).join('');
  const moon='<path d="M15.5 4.5a7.5 7.5 0 1 0 4 12.8A6.5 6.5 0 0 1 15.5 4.5z" fill="#dfe6ff"/>';
  const small=day?'<g transform="translate(-3 -4) scale(.75)">'+sunG+'</g>':'<g transform="translate(-2 -4) scale(.7)">'+moon+'</g>';
  const drops='<g stroke="#6fd0ff" stroke-width="1.8" stroke-linecap="round"><line x1="9" y1="20.5" x2="8" y2="23"/><line x1="13" y1="20.5" x2="12" y2="23"/><line x1="17" y1="20.5" x2="16" y2="23"/></g>';
  let s;
  if(code<=1)s=day?sunG:moon;
  else if(code==2)s=small+CL;
  else if(code==3)s=CL;
  else if(code<=48)s=CL+'<g stroke="#aab4c4" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="21" x2="19" y2="21"/><line x1="7" y1="23" x2="17" y2="23"/></g>';
  else if(code>=95)s=CLD+'<path d="M13 17l-3 4h3l-2 3.5" fill="none" stroke="#ffd34d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
  else s=(code>=61?CLD:CL)+drops;
  return `<svg viewBox="0 0 24 25">${s}</svg>`;
}
const hm=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function hours(w,c){
  const T=w.hourly.time.map(t=>new Date(t)),ct=new Date(c.time);
  let st=T.findIndex(t=>t.getTime()>ct.getTime()-36e5);if(st<0)st=0;
  const rises=w.daily.sunrise.map(t=>new Date(t)),sets=w.daily.sunset.map(t=>new Date(t));
  const isDay=t=>rises.some((r,i)=>t>=r&&t<sets[i]);
  let items=[];
  for(let i=st;i<Math.min(st+24,T.length);i++){
    const t=T[i],p=w.hourly.precipitation_probability[i];
    items.push({t,html:`<div class="hr${i===st?' now':''}"><div class="l">${i===st?'Agora':t.getHours()+'h'}</div>${ic(w.hourly.weather_code[i],isDay(t))}<div class="v">${Math.round(i===st?c.temperature_2m:w.hourly.temperature_2m[i])}°</div><div class="p">${p>=20?p+'%':''}</div></div>`});
  }
  const end=items.length?items[items.length-1].t:ct;
  const up='<circle cx="12" cy="15" r="4.5" fill="#ffc94d"/><line x1="3" y1="20" x2="21" y2="20" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v5M9.5 5.5L12 3l2.5 2.5" fill="none" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/>';
  const dn='<circle cx="12" cy="15" r="4.5" fill="#ff9a5a"/><line x1="3" y1="20" x2="21" y2="20" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v5M9.5 5.5L12 8l2.5-2.5" fill="none" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/>';
  [...rises.map(t=>[t,'Nascer',up]),...sets.map(t=>[t,'Pôr do sol',dn])].forEach(([t,l,s])=>{
    if(t>ct&&t<end)items.push({t,html:`<div class="hr sunx"><div class="l">${hm(t)}</div><svg viewBox="0 0 24 25">${s}</svg><div class="v">${l}</div><div class="p"></div></div>`})});
  items.sort((a,b)=>a.t-b.t);
  document.getElementById('hrs').innerHTML=items.map(x=>x.html).join('');
}
function days(w,c){
  const D=w.daily,n=D.time.length,gmn=Math.min(...D.temperature_2m_min),gmx=Math.max(...D.temperature_2m_max),R=gmx-gmn||1;
  const dt=i=>new Date(D.time[i]+'T12:00');
  const name=i=>{if(i===0)return'Hoje';const s=dt(i).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');return s[0].toUpperCase()+s.slice(1)};
  const col=v=>{const k=(v-gmn)/R;return k<.33?'#6fd0ff':k<.66?'#9be38a':'#ffc27a'};
  let h='';
  for(let i=0;i<n;i++){
    const mn=D.temperature_2m_min[i],mx=D.temperature_2m_max[i],p=D.precipitation_probability_max[i],a=(mn-gmn)/R*100,b=(mx-gmn)/R*100;
    const dot=i===0?`<em style="left:${Math.max(0,Math.min(100,(c.temperature_2m-gmn)/R*100))}%"></em>`:'';
    h+=`<div class="dy"><span class="n">${name(i)}</span>${ic(D.weather_code[i],true)}<span class="rp">${p>=20?p+'%':''}</span><span class="mn">${Math.round(mn)}°</span><div class="rg"><i style="left:${a}%;width:${b-a}%;background:linear-gradient(90deg,${col(mn)},${col(mx)})"></i>${dot}</div><span class="mx">${Math.round(mx)}°</span></div>`;
  }
  document.getElementById('days').innerHTML=h;
}

  return m<60?`há ${Math.max(m,1)} min`:m<1440?`há ${Math.round(m/60)} h`:new Date(iso).toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}
function render(d){
  const N=d.noticias||{},tabs=$('tabs'),news=$('news');tabs.innerHTML='';
  const showN=k=>{[...tabs.children].forEach(t=>t.classList.toggle('on',t.textContent===k));
    news.innerHTML=(N[k]||[]).map(n=>`<a class="nw" href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.titulo)}<small>${esc(n.fonte)} · ${ago(n.quando)}</small></a>`).join('')||'<p class="nw" style="border:0;color:var(--dim)">Sem notícias agora</p>'};
  Object.keys(N).filter(k=>N[k].length).forEach(k=>{const t=document.createElement('span');t.className='tab';t.textContent=k;t.onclick=()=>showN(k);tabs.appendChild(t)});
  if(tabs.firstChild)showN(tabs.firstChild.textContent);
  $('newsat').textContent=d.gerado_em?'robô '+new Date(d.gerado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
  if(d.nasa){$('nasabox').style.display='block';$('nasabox').href=d.nasa.link;
    $('nasa').style.background=`#03040a url("${d.nasa.imagem}") center/cover`;$('nasat').textContent=d.nasa.titulo;$('nasad').textContent=d.nasa.texto}
  if(d.neste_dia&&d.neste_dia.length){$('ndbox').style.display='block';
    $('ndday').textContent=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long'});
    $('nd').innerHTML=d.neste_dia.map(e=>`<a class="nw" href="${esc(e.link||'#')}" target="_blank" rel="noopener"><span style="color:var(--warm);font-weight:600">${esc(e.ano)}</span> · ${esc(e.texto)}</a>`).join('')}
  if(d.palavra){$('wbox').style.display='block';$('wen').textContent=d.palavra.en;$('wpt').textContent=`${d.palavra.fon} · ${d.palavra.pt}`;$('wex').textContent=`“${d.palavra.ex}”`}
}
fetch('https://raw.githubusercontent.com/PhelipeFraga/bom-dia/main/data.json?t='+Date.now())
  .then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>fetch('data.json').then(r=>r.json()))
  .then(render).catch(()=>{$('news').innerHTML='<p class="nw" style="border:0;color:var(--dim)">O robô ainda não rodou</p>'});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
