<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bom dia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f14">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0d0f14;--card:#171a21;--card2:#1c1f27;--line:rgba(255,255,255,.07);--txt:#f3f1ee;--dim:rgba(243,241,238,.55);--faint:rgba(243,241,238,.32);--gold:#ffd08a;--rain:#8fd0ff;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.app{max-width:460px;margin:0 auto;padding-bottom:calc(96px + var(--safe-bot))}
.tela{display:none}.tela.on{display:block}
.serif{font-family:Newsreader,Georgia,serif}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.dim{color:var(--dim)}
.src{font-size:12px;color:var(--dim);margin-top:6px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(13,15,20,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 0 calc(10px + var(--safe-bot))}
.nav .in{max-width:460px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Manrope,sans-serif;color:var(--faint);cursor:pointer;width:76px}
.nav button.on{color:var(--gold)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* HOJE: céu */
.sky{position:relative;height:calc(480px + var(--safe-top));overflow:hidden;transition:background 1.2s}
.sky canvas,.sky .stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(26px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-70%)}to{transform:translateX(170%)}}
.city{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:150px;display:block}
.hero{position:absolute;inset:0;padding:calc(30px + var(--safe-top)) 24px 0;z-index:2}
.dia{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.oi{font-size:24px;font-weight:600;margin-top:2px}
.temp{font-size:118px;font-weight:300;line-height:.95;letter-spacing:-5px;margin-top:20px}
.cond{font-size:17px;font-weight:600;margin-top:8px}
.rb{width:230px;margin-top:16px}
.rbar{display:flex;align-items:flex-end;gap:4px;height:34px}
.rbar i{flex:1;background:rgba(170,220,255,.9);border-radius:3px 3px 1px 1px;min-height:2px}
.rl{display:flex;justify-content:space-between;font-size:11px;margin-top:5px;opacity:.9}
.rl b{font-weight:700}
.vivo{font-size:11px;opacity:.7;margin-top:8px}

.resumo{padding:0 22px;position:relative;z-index:3;margin-top:-6px}
.bl{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.4}
.bl:last-child{border:0}
.bl b{font-weight:700}
.ic{width:30px;height:30px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
.cards{display:flex;gap:12px;padding:18px 22px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:270px;border-radius:22px;padding:16px 18px;background:var(--card);scroll-snap-align:start;display:block}
.card h3{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:19px;line-height:1.24;margin:8px 0 2px}
.sub{padding:22px 22px 0}

/* cabeçalho das outras telas */
.hd{padding:calc(28px + var(--safe-top)) 22px 0}
.hd h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:38px;letter-spacing:-.5px}

/* NOTÍCIAS */
.chips{display:flex;gap:8px;padding:16px 22px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:600;padding:8px 15px;border-radius:99px;background:var(--card2);color:var(--dim);cursor:pointer;border:0;font-family:inherit}
.chip.on{background:var(--txt);color:var(--bg)}
.lead{display:block;margin:16px 22px 6px;border-radius:24px;padding:20px;background:linear-gradient(160deg,#2a2440,#191c23 70%)}
.lead h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:25px;line-height:1.18;margin:10px 0 4px}
.it{display:flex;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it .n{font-family:Newsreader,Georgia,serif;font-size:22px;color:var(--faint);width:18px;flex:none}
.it h4{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:17px;line-height:1.28;margin-top:2px}

/* TEMPO */
.box{margin:16px 16px 0;background:var(--card);border-radius:24px;padding:18px;overflow:hidden}
.h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.h b{font-weight:500;letter-spacing:0;text-transform:none}
.sunw svg{width:100%;height:auto;display:block}
.sunl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:4px}
#smid{font-weight:700;color:var(--txt)}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:99px;padding:3px;letter-spacing:0;text-transform:none}
.sg{font-size:13px;font-weight:600;padding:5px 14px;border-radius:99px;color:var(--dim);cursor:pointer}
.sg.on{background:var(--txt);color:var(--bg)}
.hrs{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.hrs::-webkit-scrollbar{display:none}
.hr{flex:none;width:58px;padding:12px 0;border-radius:18px;text-align:center}
.hr.now{background:rgba(255,255,255,.08)}
.hr .l{font-size:12px;color:var(--dim);font-weight:600}.hr.now .l{color:var(--txt)}
.hr svg{width:30px;height:30px;margin:8px auto 6px;display:block}
.hr .v{font-size:17px;font-weight:600}
.hr .p{font-size:11px;color:var(--rain);font-weight:700;height:14px;margin-top:2px}
.hr.sunx .v{font-size:11.5px;color:var(--gold)}
.dy{display:grid;grid-template-columns:44px 28px 34px 30px 1fr 30px;align-items:center;gap:6px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.dy .n{font-weight:600}.dy svg{width:26px;height:26px}
.dy .rp{font-size:12px;color:var(--rain);font-weight:700}
.dy .mn{color:var(--dim);text-align:right}.dy .mx{text-align:right;font-weight:600}
.rg{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.08)}
.rg i{position:absolute;top:0;bottom:0;border-radius:6px}
.rg em{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2px solid var(--bg)}
#map{height:300px;border-radius:16px;background:#111}
.leaflet-container{background:#111;font-family:inherit}
.mapbar{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--dim)}
.prog{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--rain);width:0;transition:width .4s}
.lg{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--dim);margin-top:8px}
.lg i{width:26px;height:6px;border-radius:3px}

/* DESCOBRIR */
.nasa{display:block;height:calc(360px + var(--safe-top));background:#05060a center/cover;position:relative}
.nasa:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,20,0) 40%,var(--bg))}
.nasa .t{position:absolute;left:22px;right:22px;bottom:14px;z-index:2}
.nasa h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:30px;line-height:1.1;margin-top:6px}
.nasa p{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sect{padding:18px 22px 0}
.tl{margin-top:12px;padding-left:20px;border-left:1px solid rgba(255,208,138,.35)}
.tl a{display:block;position:relative;margin-bottom:14px;font-size:14px;line-height:1.45}
.tl a:before{content:"";position:absolute;left:-25px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.tl b{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:17px;color:var(--gold);margin-right:6px}
.word{margin:10px 22px 0;border-radius:22px;padding:16px 18px;background:var(--card);display:flex;align-items:center;gap:14px}
.play{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;border:0;cursor:pointer}
.foot{text-align:center;font-size:11.5px;color:var(--faint);margin-top:26px;padding:0 22px}
</style>
</head>
<body>
<div class="app">

<!-- ============ HOJE ============ -->
<section class="tela on" id="t-hoje">
  <div class="sky" id="sky">
    <div class="stars" id="stars"></div>
    <div class="cloud" style="width:250px;height:84px;top:110px;animation-duration:80s"></div>
    <div class="cloud" style="width:210px;height:70px;top:210px;animation-duration:105s;animation-delay:-50s"></div>
    <canvas id="rain"></canvas>
    <svg class="city" id="city" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice"></svg>
    <div class="hero">
      <div class="dia" id="dia"></div>
      <div class="oi" id="oi">Bom dia, Phelipe</div>
      <div class="temp" id="temp">--°</div>
      <div class="cond" id="cond">Carregando…</div>
      <div class="rb">
        <div class="rbar" id="rbar"></div>
        <div class="rl"><span id="rl0"></span><b id="rlm"></b><span id="rl1"></span></div>
      </div>
      <div class="vivo" id="vivo"></div>
    </div>
  </div>
  <div class="resumo">
    <div class="tag" style="color:var(--gold);margin-bottom:2px">Seu resumo</div>
    <div id="resumo"></div>
  </div>
  <div class="sub"><span class="tag dim">Em destaque</span></div>
  <div class="cards" id="cards"></div>
  <p class="foot" id="foot1"></p>
</section>

<!-- ============ NOTÍCIAS ============ -->
<section class="tela" id="t-noticias">
  <div class="hd"><div class="tag dim" id="atual"></div><h1>Notícias</h1></div>
  <div class="chips" id="chips"></div>
  <div id="lista"><p class="sect dim">Carregando…</p></div>
</section>

<!-- ============ TEMPO ============ -->
<section class="tela" id="t-tempo">
  <div class="hd"><div class="tag dim">São Paulo</div><h1>Tempo</h1></div>
  <div class="box">
    <div class="h">Sol</div>
    <div class="sunw">
      <svg viewBox="0 0 300 74">
        <line x1="6" y1="64" x2="294" y2="64" stroke="rgba(255,255,255,.18)"/>
        <path d="M20 64 Q150 -36 280 64" fill="none" stroke="rgba(255,255,255,.25)" stroke-dasharray="2 5"/>
        <path id="sprog" fill="none" stroke="#ffd08a" stroke-width="2.5" stroke-linecap="round"/>
        <circle id="sunglow" r="13" fill="#ffd08a" opacity=".22"/>
        <circle id="sun" r="6.5" fill="#fff1cf"/>
      </svg>
      <div class="sunl"><span id="sr"></span><span id="smid"></span><span id="ss"></span></div>
    </div>
  </div>
  <div class="box">
    <div class="h"><span class="seg"><span class="sg on" data-v="hrs">24 horas</span><span class="sg" data-v="days">7 dias</span></span><b id="rainmax"></b></div>
    <div class="hrs" id="hrs"></div>
    <div id="days" style="display:none"></div>
  </div>
  <div class="box">
    <div class="h">Radar de chuva <b id="frametime"></b></div>
    <div id="map"></div>
    <div class="mapbar"><span id="pp" style="cursor:pointer">❚❚</span><div class="prog"><i id="prog"></i></div><span>últimas 2h</span></div>
    <div class="lg">fraca <i style="background:#88ddee"></i><i style="background:#0099cc"></i><i style="background:#ffaa00"></i><i style="background:#ff4400"></i> forte<span style="margin-left:auto">mapa: Esri · radar: RainViewer</span></div>
  </div>
</section>

<!-- ============ DESCOBRIR ============ -->
<section class="tela" id="t-descobrir">
  <a class="nasa" id="nasa" target="_blank" rel="noopener"><div class="t"><span class="tag" style="color:var(--gold)">Foto do dia · NASA</span><h2 id="nasat"></h2><p id="nasad"></p></div></a>
  <div class="sect"><span class="tag dim" id="ndday">Neste dia</span><div class="tl" id="nd"></div></div>
  <div class="sect" style="padding-top:4px"><span class="tag dim">Palavra do dia</span></div>
  <div class="word"><button class="play" id="play" aria-label="Ouvir">▶</button><div><div class="serif" style="font-size:26px;font-weight:500" id="wen"></div><div class="dim" style="font-size:13px" id="wpt"></div><div style="font-size:14px;font-style:italic;margin-top:4px" id="wex"></div></div></div>
  <p class="foot">Foto: NASA · Neste dia: Wikipédia</p>
</section>

</div>

<nav class="nav"><div class="in">
  <button class="on" data-t="hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
  <button data-t="noticias"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>Notícias</button>
  <button data-t="tempo"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></svg>Tempo</button>
  <button data-t="descobrir"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Descobrir</button>
</div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAT=-23.55,LON=-46.63,agora=new Date(),H=agora.getHours();
const WMO={0:"Céu limpo",1:"Quase limpo",2:"Parcialmente nublado",3:"Nublado",45:"Neblina",48:"Neblina",51:"Garoa fraca",53:"Garoa",55:"Garoa forte",61:"Chuva fraca",63:"Chuva",65:"Chuva forte",80:"Pancadas fracas",81:"Pancadas de chuva",82:"Pancadas fortes",95:"Trovoadas",96:"Trovoadas",99:"Trovoadas"};
const COR={"Brasil":"#c9b4ff","Mundo":"#9ab8ff","Economia":"#8fd1a8","São Paulo":"#ffb3a1","IA e tech":"#ffb98a","Ciência":"#7fd6e8","Games":"#f0a3c4","Cultura":"#e8d27f"};
const hm=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function ago(iso){if(!iso)return'';const m=Math.round((Date.now()-new Date(iso))/6e4);
  return m<60?`há ${Math.max(m,1)} min`:m<1440?`há ${Math.round(m/60)} h`:new Date(iso).toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}

/* ---------- navegação ---------- */
let mapa=null;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tela').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.t));
  scrollTo(0,0);
  if(b.dataset.t==='tempo'&&mapa)setTimeout(()=>mapa.invalidateSize(),50);
});
// Link direto para uma aba: .../bom-dia/#tempo
addEventListener('load',()=>{const b=document.querySelector(`.nav button[data-t="${location.hash.slice(1)}"]`);if(b)b.click()});

/* ---------- céu e cidade ---------- */
$('dia').textContent=agora.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
$('oi').textContent=(H>=5&&H<12?'Bom dia':H>=12&&H<18?'Boa tarde':'Boa noite')+', Phelipe';
const noite=H<5||H>=19;
function ceu(chuva){
  const g=chuva?(noite?['#141923','#222a38','#323c4e']:['#3a4556','#56657a','#7b8799'])
    :noite?['#070b1c','#141a3a','#262c55']
    :H<7?['#27355f','#7a5a86','#e4937a']
    :H<16?['#2d6ad0','#5b98e3','#a7cdf2']
    :['#33276a','#a9547c','#f09a62'];
  $('sky').style.background=`linear-gradient(180deg,${g[0]} 0%,${g[1]} 52%,${g[2]} 100%)`;
}
ceu(false);
if(noite){const s=$('stars');for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*60+'%';e.style.opacity=(.2+Math.random()*.8).toFixed(2);s.appendChild(e)}}
// Silhueta de São Paulo: prédios gerados com semente fixa (sempre o mesmo desenho) + ponte estaiada
(function(){
  let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const bg='#0d0f14';let h='',x=-4;
  while(x<400){const w=10+r()*22,ht=26+r()*(x>150&&x<250?70:52);
    if(!(x>282&&x<350)){h+=`<rect x="${x.toFixed(1)}" y="${(150-ht).toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" fill="${bg}"/>`;
      if(r()<.25)h+=`<rect x="${(x+w/2-.6).toFixed(1)}" y="${(150-ht-10).toFixed(1)}" width="1.2" height="10" fill="${bg}"/>`;
      if(noite)for(let k=0;k<4;k++)if(r()<.5)h+=`<rect x="${(x+2+r()*(w-5)).toFixed(1)}" y="${(150-ht+5+r()*(ht-12)).toFixed(1)}" width="1.6" height="2" fill="#ffd08a" opacity="${(.35+r()*.5).toFixed(2)}"/>`;}
    x+=w+1+r()*3}
  // ponte Octávio Frias: mastro em X e cabos
  const mx=316,top=60,deck=128;
  h+=`<path d="M${mx-9} ${deck+22} L${mx+3} ${top} M${mx+9} ${deck+22} L${mx-3} ${top}" stroke="${bg}" stroke-width="3.2"/>`;
  for(let k=0;k<7;k++){const yy=top+8+k*7;h+=`<path d="M${mx} ${yy} L${mx-60+k*6} ${deck} M${mx} ${yy} L${mx+60-k*6} ${deck}" stroke="${bg}" stroke-width=".7"/>`}
  h+=`<rect x="276" y="${deck}" width="84" height="4" fill="${bg}"/><rect x="0" y="146" width="400" height="6" fill="${bg}"/>`;
  $('city').innerHTML=h;
})();
let chovendo=false;
const cv=$('rain'),cx=cv.getContext('2d'),gotas=[];
function tam(){cv.width=cv.offsetWidth*devicePixelRatio;cv.height=cv.offsetHeight*devicePixelRatio}
tam();addEventListener('resize',tam);
for(let i=0;i<120;i++)gotas.push({x:Math.random(),y:Math.random(),v:.006+Math.random()*.008,l:10+Math.random()*14});
(function loop(){cx.clearRect(0,0,cv.width,cv.height);if(chovendo){cx.strokeStyle="rgba(205,228,255,.45)";cx.lineWidth=1.2*devicePixelRatio;cx.beginPath();
for(const d of gotas){d.y+=d.v;if(d.y>1){d.y=-.05;d.x=Math.random()}const X=d.x*cv.width,Y=d.y*cv.height;cx.moveTo(X,Y);cx.lineTo(X-2*devicePixelRatio,Y+d.l*devicePixelRatio)}cx.stroke()}
requestAnimationFrame(loop)})();

/* ---------- ícones do tempo ---------- */
const CL='<path d="M8 19h9.5a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 6.5 11a4 4 0 0 0 1.5 8z" fill="#e8edf5"/>';
const CLD='<path d="M8 19h9.5a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 6.5 11a4 4 0 0 0 1.5 8z" fill="#aab4c4"/>';
function ic(code,day){
  const sunG='<circle cx="12" cy="12" r="4.6" fill="#ffc94d"/>'+[0,45,90,135,180,225,270,315].map(a=>`<line x1="12" y1="3" x2="12" y2="5.2" stroke="#ffc94d" stroke-width="1.8" stroke-linecap="round" transform="rotate(${a} 12 12)"/>`).join('');
  const moon='<path d="M15.5 4.5a7.5 7.5 0 1 0 4 12.8A6.5 6.5 0 0 1 15.5 4.5z" fill="#dfe6ff"/>';
  const small=day?'<g transform="translate(-3 -4) scale(.75)">'+sunG+'</g>':'<g transform="translate(-2 -4) scale(.7)">'+moon+'</g>';
  const drops='<g stroke="#6fd0ff" stroke-width="1.8" stroke-linecap="round"><line x1="9" y1="20.5" x2="8" y2="23"/><line x1="13" y1="20.5" x2="12" y2="23"/><line x1="17" y1="20.5" x2="16" y2="23"/></g>';
  let s;
  if(code<=1)s=day?sunG:moon;
  else if(code==2)s=small+CL;
  else if(code==3)s=CL;
  else if(code<=48)s=CL+'<g stroke="#aab4c4" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="21" x2="19" y2="21"/><line x1="7" y1="23" x2="17" y2="23"/></g>';
  else if(code>=95)s=CLD+'<path d="M13 17l-3 4h3l-2 3.5" fill="none" stroke="#ffd34d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
  else s=(code>=61?CLD:CL)+drops;
  return `<svg viewBox="0 0 24 25">${s}</svg>`;
}

/* ---------- tempo ---------- */
function idxAgora(w){const T=w.hourly.time.map(t=>new Date(t));let i=T.findIndex(t=>t.getTime()>Date.now()-36e5);return[T,i<0?0:i]}
function barraChuva(w){
  const[T,i]=idxAgora(w),P=w.hourly.precipitation_probability.slice(i,i+12),Hs=T.slice(i,i+12);
  $('rbar').innerHTML=P.map(p=>`<i style="height:${Math.max(4,p)}%;opacity:${(.35+p/160).toFixed(2)}"></i>`).join('');
  const mx=Math.max(...P),k=P.indexOf(mx);
  $('rl0').textContent=Hs[0].getHours()+'h';$('rl1').textContent=Hs[Hs.length-1].getHours()+'h';
  $('rlm').textContent=mx>=50?`mais chuva às ${Hs[k].getHours()}h`:mx>=25?`chance de chuva às ${Hs[k].getHours()}h`:'sem chuva prevista';
  return{mx,hora:Hs[k].getHours()};
}
function sol(w){
  const R=w.daily.sunrise.map(t=>new Date(t)),S=w.daily.sunset.map(t=>new Date(t)),a=new Date();
  const dur=ms=>{const m=Math.round(ms/6e4);return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`};
  const P=c=>[(1-c)*(1-c)*20+2*(1-c)*c*150+c*c*280,(1-c)*(1-c)*64+2*(1-c)*c*(-36)+c*c*64];
  let i=R.findIndex((r,k)=>a<S[k]);if(i<0)i=R.length-1;
  const rise=R[i],set=S[i],dia=a>=rise&&a<set;
  $('sr').textContent=`↑ ${hm(rise)}`+(i>0?' amanhã':'');$('ss').textContent=`${hm(set)} ↓`;
  if(dia){const c=(a-rise)/(set-rise),[x,y]=P(c);let d='';for(let k=0;k<=40;k++){const[px,py]=P(c*k/40);d+=(k?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}
    $('sprog').setAttribute('d',d);['sun','sunglow'].forEach(id=>{$(id).setAttribute('cx',x);$(id).setAttribute('cy',y);$(id).style.display=''});
    $('smid').textContent=`pôr do sol em ${dur(set-a)}`}
  else{$('sprog').setAttribute('d','');['sun','sunglow'].forEach(id=>$(id).style.display='none');$('smid').textContent=`nasce em ${dur(rise-a)}`}
}
function horas(w,c){
  const[T,st]=idxAgora(w),ct=new Date(c.time);
  const rises=w.daily.sunrise.map(t=>new Date(t)),sets=w.daily.sunset.map(t=>new Date(t));
  const isDay=t=>rises.some((r,i)=>t>=r&&t<sets[i]);let items=[];
  for(let i=st;i<Math.min(st+24,T.length);i++){const t=T[i],p=w.hourly.precipitation_probability[i];
    items.push({t,html:`<div class="hr${i===st?' now':''}"><div class="l">${i===st?'Agora':t.getHours()+'h'}</div>${ic(w.hourly.weather_code[i],isDay(t))}<div class="v">${Math.round(i===st?c.temperature_2m:w.hourly.temperature_2m[i])}°</div><div class="p">${p>=20?p+'%':''}</div></div>`})}
  const end=items.length?items[items.length-1].t:ct;
  const up='<circle cx="12" cy="15" r="4.5" fill="#ffc94d"/><line x1="3" y1="20" x2="21" y2="20" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v5M9.5 5.5L12 3l2.5 2.5" fill="none" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/>';
  const dn='<circle cx="12" cy="15" r="4.5" fill="#ff9a5a"/><line x1="3" y1="20" x2="21" y2="20" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v5M9.5 5.5L12 8l2.5-2.5" fill="none" stroke="#ffc27a" stroke-width="1.6" stroke-linecap="round"/>';
  [...rises.map(t=>[t,'Nascer',up]),...sets.map(t=>[t,'Pôr do sol',dn])].forEach(([t,l,s])=>{
    if(t>ct&&t<end)items.push({t,html:`<div class="hr sunx"><div class="l">${hm(t)}</div><svg viewBox="0 0 24 25">${s}</svg><div class="v">${l}</div><div class="p"></div></div>`})});
  items.sort((a,b)=>a.t-b.t);$('hrs').innerHTML=items.map(x=>x.html).join('');
}
function dias(w,c){
  const D=w.daily,n=D.time.length,gmn=Math.min(...D.temperature_2m_min),gmx=Math.max(...D.temperature_2m_max),R=gmx-gmn||1;
  const dt=i=>new Date(D.time[i]+'T12:00');
  const nome=i=>{if(i===0)return'Hoje';const s=dt(i).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');return s[0].toUpperCase()+s.slice(1)};
  const col=v=>{const k=(v-gmn)/R;return k<.33?'#6fd0ff':k<.66?'#9be38a':'#ffc27a'};let h='';
  for(let i=0;i<n;i++){const mn=D.temperature_2m_min[i],mx=D.temperature_2m_max[i],p=D.precipitation_probability_max[i],a=(mn-gmn)/R*100,b=(mx-gmn)/R*100;
    const dot=i===0?`<em style="left:${Math.max(0,Math.min(100,(c.temperature_2m-gmn)/R*100))}%"></em>`:'';
    h+=`<div class="dy"><span class="n">${nome(i)}</span>${ic(D.weather_code[i],true)}<span class="rp">${p>=20?p+'%':''}</span><span class="mn">${Math.round(mn)}°</span><div class="rg"><i style="left:${a}%;width:${b-a}%;background:linear-gradient(90deg,${col(mn)},${col(mx)})"></i>${dot}</div><span class="mx">${Math.round(mx)}°</span></div>`}
  $('days').innerHTML=h;
}
document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sg').forEach(x=>x.classList.toggle('on',x===b));
  $('hrs').style.display=b.dataset.v==='hrs'?'flex':'none';$('days').style.display=b.dataset.v==='days'?'block':'none';
});
function aoVivo(url,reserva){
  return Promise.race([fetch(url).then(r=>{if(!r.ok)throw 0;return r.json()}),new Promise((_,j)=>setTimeout(j,6000))])
    .then(d=>({d,vivo:true})).catch(()=>reserva().then(d=>({d,vivo:false})));
}

/* ---------- dados do robô ---------- */
// No ar, lê a versão mais nova direto do GitHub; testando no PC (localhost), lê o arquivo local
const RAW='https://raw.githubusercontent.com/PhelipeFraga/bom-dia/main/data.json?t='+Date.now();
const fontes=location.hostname==='localhost'?['data.json',RAW]:[RAW,'data.json'];
const dados=fetch(fontes[0]).then(r=>{if(!r.ok)throw 0;return r.json()})
  .catch(()=>fetch(fontes[1]).then(r=>r.json())).catch(()=>({}));

let previsao=null;
const WURL=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,precipitation&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=7`;
const clima=aoVivo(WURL,()=>dados.then(d=>d.clima)).then(({d:w,vivo})=>{
  if(!w)throw 0;
  const c=w.current,code=c.weather_code;
  $('temp').textContent=Math.round(c.temperature_2m)+'°';
  $('cond').textContent=`${WMO[code]||'—'} · máx ${Math.round(w.daily.temperature_2m_max[0])}°`;
  $('vivo').textContent=(vivo?'ao vivo ':'dados das ')+hm(new Date(c.time));
  chovendo=code>=51||c.precipitation>0;ceu(chovendo);
  previsao=barraChuva(w);previsao.tmax=Math.round(w.daily.temperature_2m_max[0]);
  $('rainmax').textContent=`chuva até ${w.daily.precipitation_probability_max[0]}% hoje`;
  sol(w);setInterval(()=>sol(w),6e4);horas(w,c);dias(w,c);
  return previsao;
}).catch(()=>{$('cond').textContent='Sem conexão com o serviço de clima';return null});

/* ---------- radar ---------- */
try{
  mapa=L.map('map',{zoomControl:false,attributionControl:false}).setView([LAT,LON],8);
  const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_';
  L.tileLayer(ESRI+'Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:12}).addTo(mapa);
  mapa.createPane('rotulos').style.zIndex=650;mapa.getPane('rotulos').style.pointerEvents='none';
  L.tileLayer(ESRI+'Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:12,pane:'rotulos'}).addTo(mapa);
  L.circleMarker([LAT,LON],{radius:6,color:'#fff',weight:2,fillColor:'#8ab4ff',fillOpacity:1}).addTo(mapa);
  let frames=[],camadas=[],fi=0,rodando=true;
  const mostra=i=>{camadas[fi]&&camadas[fi].setOpacity(0);fi=i;camadas[fi].setOpacity(.8);
    $('frametime').textContent=hm(new Date(frames[fi].time*1000));$('prog').style.width=((fi+1)/frames.length*100)+'%'};
  aoVivo('https://api.rainviewer.com/public/weather-maps.json',()=>dados.then(d=>d.radar)).then(({d})=>{
    if(!d)return;frames=d.radar.past;
    camadas=frames.map(f=>L.tileLayer(`${d.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,maxNativeZoom:7,maxZoom:12}).addTo(mapa));
    mostra(frames.length-1);setInterval(()=>{if(rodando)mostra((fi+1)%frames.length)},700);
  });
  $('pp').onclick=e=>{rodando=!rodando;e.target.textContent=rodando?'❚❚':'▶'};
}catch(e){$('map').innerHTML='<p style="padding:20px;color:#888">Mapa indisponível</p>'}

/* ---------- notícias ---------- */
const tag=t=>`<span class="tag" style="color:${COR[t]||'var(--gold)'}">${esc(t)}</span>`;
function lista(itens,rotuloLead){
  if(!itens||!itens.length)return'<p class="sect dim">Sem notícias agora</p>';
  const[l,...resto]=itens;
  return `<a class="lead" href="${esc(l.link)}" target="_blank" rel="noopener">${tag(rotuloLead||l.tema)}<h2>${esc(l.titulo)}</h2><div class="src">${esc(l.fonte)} · ${ago(l.quando)}</div></a>`+
    resto.map((n,i)=>`<a class="it" href="${esc(n.link)}" target="_blank" rel="noopener"><div class="n">${i+2}</div><div>${tag(n.tema)}<h4>${esc(n.titulo)}</h4><div class="src">${esc(n.fonte)} · ${ago(n.quando)}</div></div></a>`).join('');
}
dados.then(d=>{
  const N=d.noticias||{},D=d.destaques||[];
  if(d.gerado_em)$('atual').textContent='atualizado '+ago(d.gerado_em);
  const abas=['Destaques',...Object.keys(N).filter(k=>N[k].length)];
  const ver=k=>{[...$('chips').children].forEach(c=>c.classList.toggle('on',c.textContent===k));
    $('lista').innerHTML=k==='Destaques'?lista(D,D[0]&&D[0].tema+' · principal do dia'):lista(N[k])};
  $('chips').innerHTML=abas.map(k=>`<button class="chip">${esc(k)}</button>`).join('');
  [...$('chips').children].forEach(c=>c.onclick=()=>ver(c.textContent));ver('Destaques');
  $('cards').innerHTML=D.map(n=>`<a class="card" href="${esc(n.link)}" target="_blank" rel="noopener">${tag(n.tema)}<h3>${esc(n.titulo)}</h3><div class="src">${esc(n.fonte)} · ${ago(n.quando)}</div></a>`).join('');
  $('foot1').textContent=d.gerado_em?`Notícias atualizadas ${ago(d.gerado_em)} · o robô passa de hora em hora`:'';
  // Descobrir
  if(d.nasa){$('nasa').href=d.nasa.link;$('nasa').style.backgroundImage=`url("${d.nasa.imagem}")`;$('nasat').textContent=d.nasa.titulo;$('nasad').textContent=d.nasa.texto}
  $('ndday').textContent='Neste dia · '+agora.toLocaleDateString('pt-BR',{day:'numeric',month:'long'});
  $('nd').innerHTML=(d.neste_dia||[]).map(e=>`<a href="${esc(e.link||'#')}" target="_blank" rel="noopener"><b>${esc(e.ano)}</b>${esc(e.texto)}</a>`).join('');
  if(d.palavra){$('wen').textContent=d.palavra.en;$('wpt').textContent=`${d.palavra.fon} · ${d.palavra.pt}`;$('wex').textContent=`“${d.palavra.ex}”`;
    $('play').onclick=()=>{try{speechSynthesis.cancel();const f=new SpeechSynthesisUtterance(d.palavra.en+'. '+d.palavra.ex);f.lang='en-US';f.rate=.9;speechSynthesis.speak(f)}catch(e){}}}
  // Seu resumo: regras simples, montadas aqui mesmo
  clima.then(p=>{
    const L=[];
    if(p){if(p.mx>=50)L.push(['#1d3346','☂',`Leve guarda-chuva: <b>${p.mx}% de chuva</b> por volta das ${p.hora}h`]);
      else if(p.mx>=25)L.push(['#1d3346','☁',`Pode chover um pouco: <b>${p.mx}%</b> por volta das ${p.hora}h`]);
      else if(p.tmax>=30)L.push(['#3a2a1c','☀',`Dia quente: máxima de <b>${p.tmax}°</b>`]);
      else L.push(['#1d3346','☀',`<b>Sem chuva</b> prevista nas próximas horas`])}
    (d.avisos_sp||[]).slice(0,1).forEach(a=>L.push(['#2b2340','⇄',esc(a.titulo)]));
    if(D[0])L.push(['#3a2a1c','★',`Em destaque: <b>${esc(D[0].titulo)}</b>`]);
    $('resumo').innerHTML=L.map(([bg,i,t])=>`<div class="bl"><div class="ic" style="background:${bg}">${i}</div><div>${t}</div></div>`).join('');
  });
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
