name: Coletar dados do Bom dia

on:
  schedule:
    - cron: "50 * * * *"   # de hora em hora, aos 50 min (inclui 6h50 em SP)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/coletar.yml"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/coletar.py
      - name: Gravar data.json
        run: |
          git config user.name "bom-dia-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "dados: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push
