name: Coletar dados do Bom dia

on:
  schedule:
    - cron: "50 * * * *"   # de hora em hora, aos 50 min (inclui 6h50 em SP)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/coletar.yml"

permissions:
  contents: write

# Uma passagem por vez; se outra começar, a antiga é cancelada
concurrency:
  group: coletar
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trazer os dados da passagem anterior (para reaproveitar se uma fonte falhar)
        run: git fetch --depth=1 origin dados && git show origin/dados:data.json > data.json || echo "sem dados anteriores"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/coletar.py
      - name: Publicar no galho "dados" (substitui o anterior, sem acumular histórico)
        run: |
          git config user.name "bom-dia-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dados-novo
          git rm -rf --cached . -q
          git add -f data.json
          git commit -q -m "dados: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push -f origin HEAD:dados
